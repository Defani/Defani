<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembaca buku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  :root { --bg: #f3f4f6; --bar: #fff; --text: #111827; --muted: #4b5563; --border: #e5e7eb; --link: #1d4ed8; --page: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --bar: #1f2937; --text: #f3f4f6; --muted: #9ca3af; --border: #374151; --link: #93c5fd; --page: #fff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; flex: 1; min-width: 160px; }
  .icon { font-family: "Material Symbols Outlined"; font-size: 20px; line-height: 1; vertical-align: middle; }
  button, .btn {
    display: inline-flex; align-items: center; gap: 4px; font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: none;
  }
  button:hover, .btn:hover { border-color: var(--link); color: var(--link); }
  input[type="number"] { width: 70px; font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bar); color: var(--text); }
  .status { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 0; overflow: hidden; }
  #book { margin: 0 auto; }
  .page { background: var(--page); box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .page canvas, .page img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .page .ph { color: #9ca3af; font-size: 13px; }
  .note { text-align: center; color: var(--muted); font-size: 12.5px; padding: 0 16px 12px; }
  .note a { color: var(--link); }
</style>
</head>
<body>
<header>
  <a class="btn" href="/perpus" title="Kembali ke perpustakaan"><span class="icon" aria-hidden="true">arrow_back</span>Perpustakaan</a>
  <h1 id="title">Memuat buku…</h1>
  <button type="button" id="prev" aria-label="Halaman sebelumnya"><span class="icon" aria-hidden="true">chevron_left</span></button>
  <span class="status" id="status">–</span>
  <button type="button" id="next" aria-label="Halaman berikutnya"><span class="icon" aria-hidden="true">chevron_right</span></button>
  <label class="status">Ke halaman <input type="number" id="goto" min="1" value="1"></label>
  <a class="btn" id="download" href="#" download><span class="icon" aria-hidden="true">download</span>Unduh PDF</a>
</header>
<main><div id="book"></div></main>
<p class="note" id="note"></p>

<script>
// Reader for the library: renders a PDF with PDF.js and turns its pages with StPageFlip.
// Pages are drawn only when they come near the reading position, so long books stay light.
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params = new URLSearchParams(location.search);
const file = params.get("file");
const MAX_PAGES = Number(params.get("max")) || 300; // flipbook length; the full PDF is always downloadable
const $ = (id) => document.getElementById(id);

async function main() {
  if (!file || !file.startsWith("/perpus/")) throw new Error("File buku tidak ditemukan.");
  $("title").textContent = params.get("title") || decodeURIComponent(file.split("/").pop());
  document.title = `${$("title").textContent} · Perpustakaan`;
  $("download").href = file;

  const pdf = await pdfjsLib.getDocument(file).promise;
  const count = Math.min(pdf.numPages, MAX_PAGES);
  if (pdf.numPages > count) {
    $("note").innerHTML = `Pratinjau menampilkan ${count} dari ${pdf.numPages} halaman. <a href="${file}" target="_blank" rel="noopener">Buka PDF lengkap</a>.`;
  }

  // Page size from the first page, scaled to fit two pages side by side on screen.
  const first = await pdf.getPage(1);
  const vp = first.getViewport({ scale: 1 });
  const ratio = vp.height / vp.width;
  const area = document.querySelector("main");
  const pageW = Math.max(220, Math.min((area.clientWidth - 48) / 2, (area.clientHeight - 32) / ratio, 560));

  const book = $("book");
  for (let i = 1; i <= count; i++) {
    const el = document.createElement("div");
    el.className = "page";
    el.dataset.n = i;
    if (i === 1 || i === count) el.dataset.density = "hard";
    el.innerHTML = `<span class="ph">Halaman ${i}</span>`;
    book.appendChild(el);
  }

  const drawn = new Set();
  async function draw(n) {
    if (n < 1 || n > count || drawn.has(n)) return;
    drawn.add(n);
    const page = await pdf.getPage(n);
    const scale = (pageW * (window.devicePixelRatio || 1) * 1.4) / page.getViewport({ scale: 1 }).width;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    const el = book.querySelector(`.page[data-n="${n}"]`);
    el.replaceChildren(canvas);
  }
  const drawAround = (index) => { for (let n = index - 1; n <= index + 4; n++) draw(n); };

  const flip = new St.PageFlip(book, {
    width: Math.round(pageW), height: Math.round(pageW * ratio),
    size: "fixed", showCover: true, maxShadowOpacity: 0.35, mobileScrollSupport: false,
    usePortrait: area.clientWidth < 700,
  });
  flip.loadFromHTML(book.querySelectorAll(".page"));

  const update = () => {
    const i = flip.getCurrentPageIndex();
    $("status").textContent = `${i + 1} / ${count}`;
    $("goto").value = i + 1;
    drawAround(i + 1);
  };
  flip.on("flip", update);
  update();

  $("prev").addEventListener("click", () => flip.flipPrev());
  $("next").addEventListener("click", () => flip.flipNext());
  $("goto").addEventListener("change", (e) => {
    const n = Math.min(count, Math.max(1, Number(e.target.value) || 1));
    drawAround(n);
    flip.turnToPage(n - 1);
    update();
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") flip.flipNext();
    if (e.key === "ArrowLeft") flip.flipPrev();
  });
}

main().catch((e) => {
  $("title").textContent = "Buku belum bisa dibuka";
  $("note").innerHTML = `${e.message} <a href="/perpus">Kembali ke perpustakaan</a>.`;
});
</script>
</body>
</html>
