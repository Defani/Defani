version: 1
project:
  title: Defani Arman Alfitriansyah
  description: Forester and remote sensing analyst. Forest carbon modeling, GIS databases and WebGIS for agroforestry, and open-source geospatial tools.
  github: https://github.com/Defani/Defani
  keywords: [forestry, remote sensing, GIS, Google Earth Engine, GeoLibre, QGIS, forest carbon, WebGIS]
  abbreviations:
    GIS: Geographic Information System
    GEE: Google Earth Engine
    SQL: Structured Query Language
    BIG: Badan Informasi Geospasial (Indonesian Geospatial Information Agency)
    KLHK: Kementerian Lingkungan Hidup dan Kehutanan (Ministry of Environment and Forestry)
    BMKG: Badan Meteorologi, Klimatologi, dan Geofisika
    TNGC: Taman Nasional Gunung Ciremai (Mount Ciremai National Park)
    RBI: Rupabumi Indonesia (official topographic base map)
    EUDR: EU Deforestation Regulation
    GBIF: Global Biodiversity Information Facility
  authors:
    - name: Defani Arman Alfitriansyah
  toc:
    - file: index.md
    - file: projects.md
    - file: dashboard.md
    - file: plugins.md
    - file: geolibre.md
    - file: webgis.md
    - file: modul.md
    - file: perpus.md
    - file: panduan.md
      children:
        - pattern: panduan/*.md
    - file: repositori.md
      children:
        - pattern: repos/alat/*.md
    - file: tutorial.md
      children:
        - pattern: repos/tutorial/*.md
    - file: expertise.md
    - file: tools.md
    - file: contact.md
    - file: id/index.md
      title: Bahasa Indonesia
      children:
        - file: id/projects.md
        - file: id/dashboard.md
        - file: id/plugins.md
        - file: id/geolibre.md
        - file: id/webgis.md
