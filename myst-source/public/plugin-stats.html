<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistik pengguna plugin GeoLibre</title>
<style>
  html, body { margin: 0; background: #fff; color: #111; }
  body { font: 14px/1.45 Georgia, "Times New Roman", serif; padding: 8px 4px; }
  .fig { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 640px) { .fig { grid-template-columns: 1fr; } }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: Georgia, "Times New Roman", serif; fill: #111; }
  .caption { margin: 10px 2px 0; font-size: 13.5px; }
  .caption b { font-weight: 700; }
  .status { color: #555; font-size: 13px; }
  /* Dark theme: invert the chart, keep hues. */
  html.dark body { filter: invert(.9) hue-rotate(180deg); }
  html.dark { background: #1a1a1a; }
</style>
<script>
// Follow the site's light or dark theme (the MyST page sets class="dark" on <html>).
(function () {
  function sync() { try { document.documentElement.classList.toggle("dark", parent.document.documentElement.classList.contains("dark")); } catch (e) {} }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ["class"] }); } catch (e) {}
})();
</script>
</head>
<body>
<div class="fig">
  <svg id="users" viewBox="0 0 420 300" role="img" aria-label="Pengguna per minggu"></svg>
  <svg id="launches" viewBox="0 0 420 300" role="img" aria-label="Total launch"></svg>
</div>
<p class="caption" id="caption"><span class="status">Memuat data dari plugins.geolibre.app…</span></p>

<script>
// Usage counts from the GeoLibre plugin registry (public, CORS-enabled).
const API = "https://plugins.geolibre.app/plugins/stats.json";
const PLUGINS = [
  ["layout-composer", "Layout Composer"],
  ["geolibre-inaturalist-extractor", "iNaturalist Extractor"],
  ["geolibre-gbif-data", "GBIF Data"],
];
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs, text) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
}

// "Nice" upper bound and tick step for an axis, like matplotlib's default locator.
function niceScale(max, ticks = 5) {
  const raw = max / ticks;
  const mag = 10 ** Math.floor(Math.log10(raw || 1));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  return { top: Math.ceil(max / step) * step || step, step };
}

// One panel: axes with ticks on the left and bottom, bars per series, legend, panel label.
function panel(svg, { label, ylabel, series, groups }) {
  const W = 420, H = 300, m = { l: 58, r: 14, t: 30, b: 62 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const max = Math.max(...groups.flatMap((g) => g.values));
  const { top, step } = niceScale(max);
  const y = (v) => m.t + ph - (v / top) * ph;

  svg.append(el("text", { x: 6, y: 18, "font-size": 15, "font-weight": 700 }, label));
  // y axis and ticks
  svg.append(el("line", { x1: m.l, y1: m.t, x2: m.l, y2: m.t + ph, stroke: "#111", "stroke-width": 1 }));
  for (let v = 0; v <= top + 1e-9; v += step) {
    svg.append(el("line", { x1: m.l - 5, y1: y(v), x2: m.l, y2: y(v), stroke: "#111", "stroke-width": 1 }));
    svg.append(el("text", { x: m.l - 8, y: y(v) + 4, "font-size": 11, "text-anchor": "end" }, v.toLocaleString("id-ID")));
  }
  svg.append(el("text", { x: 14, y: m.t + ph / 2, "font-size": 12, "text-anchor": "middle", transform: `rotate(-90 14 ${m.t + ph / 2})` }, ylabel));
  // x axis
  svg.append(el("line", { x1: m.l, y1: m.t + ph, x2: m.l + pw, y2: m.t + ph, stroke: "#111", "stroke-width": 1 }));

  const gw = pw / groups.length;
  const bw = Math.min(34, (gw * 0.7) / series.length);
  groups.forEach((g, gi) => {
    const cx = m.l + gw * gi + gw / 2;
    const x0 = cx - (bw * series.length) / 2;
    g.values.forEach((v, si) => {
      const x = x0 + si * bw;
      svg.append(el("rect", { x, y: y(v), width: bw - 2, height: m.t + ph - y(v), fill: series[si].fill, stroke: "#111", "stroke-width": 0.8 }));
      svg.append(el("text", { x: x + (bw - 2) / 2, y: y(v) - 4, "font-size": 10, "text-anchor": "middle" }, v.toLocaleString("id-ID")));
    });
    svg.append(el("line", { x1: cx, y1: m.t + ph, x2: cx, y2: m.t + ph + 5, stroke: "#111", "stroke-width": 1 }));
    const words = g.name.split(" ");
    words.forEach((w, wi) => svg.append(el("text", { x: cx, y: m.t + ph + 18 + wi * 13, "font-size": 11, "text-anchor": "middle" }, w)));
  });
  // legend, top right
  if (series.length > 1) {
    series.forEach((s, si) => {
      const lx = W - m.r - 130, ly = m.t + 4 + si * 16;
      svg.append(el("rect", { x: lx, y: ly, width: 11, height: 11, fill: s.fill, stroke: "#111", "stroke-width": 0.8 }));
      svg.append(el("text", { x: lx + 17, y: ly + 10, "font-size": 11 }, s.name));
    });
  }
}

async function main() {
  const res = await fetch(API, { cache: "no-cache" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  const rows = PLUGINS.map(([id, name]) => ({ name, ...(data.plugins?.[id] || { usersThisWeek: 0, usersLastWeek: 0, launches: 0 }) }));

  panel(document.getElementById("users"), {
    label: "(a)",
    ylabel: "Pengguna unik per minggu",
    series: [{ name: "Minggu lalu", fill: "#9ca3af" }, { name: "Minggu ini", fill: "#1d4ed8" }],
    groups: rows.map((r) => ({ name: r.name, values: [r.usersLastWeek, r.usersThisWeek] })),
  });
  panel(document.getElementById("launches"), {
    label: "(b)",
    ylabel: "Total launch",
    series: [{ name: "Launch", fill: "#1d4ed8" }],
    groups: rows.map((r) => ({ name: r.name, values: [r.launches] })),
  });

  const when = data.generated ? new Date(data.generated).toLocaleString("id-ID", { dateStyle: "long", timeStyle: "short" }) : "";
  document.getElementById("caption").innerHTML =
    `<b>Gambar 1.</b> Pemakaian plugin GeoLibre buatan saya. (a) Pengguna unik per minggu ISO, minggu lalu dan minggu ini. ` +
    `(b) Total launch sejak pencatatan dimulai${data.since ? ` (${new Date(data.since).toLocaleDateString("id-ID", { dateStyle: "long" })})` : ""}. ` +
    `Sumber: <a href="https://plugins.geolibre.app/plugins/stats.json" target="_blank" rel="noopener">plugins.geolibre.app</a>${when ? `, diperbarui ${when}` : ""}.`;
}

main().catch((e) => {
  document.getElementById("caption").innerHTML = `<span class="status">Data belum bisa dimuat (${e.message}). Lihat <a href="https://plugins.geolibre.app/plugins/stats.json" target="_blank" rel="noopener">plugins.geolibre.app</a>.</span>`;
});
</script>
<script>
// English unless the embedding page is Indonesian (/id/...): translate the visible text in place.
(function () {
  var EN; try { EN = !parent.location.pathname.startsWith("/id"); } catch (e) { EN = false; }
  if (!EN) return;
  document.documentElement.lang = "en";
  var DICT = [["Pengguna unik per minggu ISO, minggu lalu dan minggu ini.", "Unique users per ISO week, last week and this week."], ["Pemakaian plugin GeoLibre buatan saya.", "Use of my GeoLibre plugins."], ["Total launch sejak pencatatan dimulai", "Total launches since counting began"], ["Pengguna unik per minggu", "Unique users per week"], ["Data belum bisa dimuat", "Data could not be loaded"], ["Memuat data dari", "Loading data from"], ["Minggu lalu", "Last week"], ["diperbarui", "updated"], ["Minggu ini", "This week"], ["Gambar 1.", "Figure 1."], ["Sumber:", "Source:"], ["Lihat", "See"]];
  var done = new WeakMap();
  function tr(root) {
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (var n = w.nextNode(); n; n = w.nextNode()) {
      var t = n.nodeValue, o = t;
      if (done.get(n) === t) continue;
      DICT.forEach(function (p) { if (o.indexOf(p[0]) >= 0) o = o.split(p[0]).join(p[1]); });
      done.set(n, o);
      if (o !== t) n.nodeValue = o;
    }
  }
  function start() {
    tr(document.body);
    new MutationObserver(function (ms) { ms.forEach(function (m) { tr(m.target.nodeType === 3 ? m.target.parentNode : m.target); }); })
      .observe(document.body, { childList: true, subtree: true, characterData: true });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
</body>
</html>
