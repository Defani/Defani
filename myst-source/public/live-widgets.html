<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info langsung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<style>
  :root { --link: #1d4ed8; --primary: #3b82f6; --surface: #f3f4f6; --border: #e5e7eb; --text: #111827; --muted: #4b5563; --accent-surface: #eff6ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--text); }
  body { font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 4px; }
  /* Booktabs-style table: heavy top and bottom rules, light rules inside. */
  .wrap { display: flex; flex-direction: column; height: 100%; }
  .grid {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr;
    border-top: 2px solid var(--text); border-bottom: 2px solid var(--text);
  }
  .card {
    display: flex; flex-direction: column; justify-content: center;
    padding: 14px 16px;
    opacity: 0; transform: translateY(6px); animation: rise .5s ease forwards;
  }
  .card:nth-child(odd) { border-right: 1px solid var(--border); }
  .card:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
  .card:nth-child(2) { animation-delay: .08s; }
  .card:nth-child(3) { animation-delay: .16s; }
  .card:nth-child(4) { animation-delay: .24s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .head { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .icon { font-family: "Material Symbols Outlined"; font-size: 18px; line-height: 1; color: var(--link); }
  .value { font-size: clamp(22px, 5vw, 32px); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 8px 0 2px; }
  .caption { font-size: 13px; color: var(--muted); margin: 8px 2px 0; }
  .caption b { color: var(--text); }
  .sub { font-size: 12.5px; color: var(--muted); }
  .sub a { color: var(--link); }
  .spin { animation: spin 1.2s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transform: none; transition: none; }
    .spin { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
<div class="grid">
  <div class="card">
    <div class="head"><span class="icon" aria-hidden="true">currency_exchange</span>Kurs USD ke Rupiah</div>
    <div class="value" id="fx">…</div>
    <div class="sub" id="fx-sub">Memuat…</div>
  </div>
  <div class="card">
    <div class="head"><span class="icon" id="wx-icon" aria-hidden="true">partly_cloudy_day</span>Cuaca Kuningan</div>
    <div class="value" id="wx">…</div>
    <div class="sub" id="wx-sub">Memuat…</div>
  </div>
  <div class="card">
    <div class="head"><span class="icon" aria-hidden="true">schedule</span>Waktu di Kuningan</div>
    <div class="value" id="clock">--:--:--</div>
    <div class="sub" id="date">WIB (UTC+7)</div>
  </div>
  <div class="card">
    <div class="head"><span class="icon" aria-hidden="true">extension</span>Pengguna plugin GeoLibre</div>
    <div class="value" id="users">…</div>
    <div class="sub" id="users-sub">Memuat…</div>
  </div>
</div>
<p class="caption"><b>Tabel 1.</b> Data langsung, diambil setiap kali halaman dibuka.</p>
</div>

<script>
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmt = (n, d = 0) => n.toLocaleString("id-ID", { minimumFractionDigits: d, maximumFractionDigits: d });

// Count a number up to its value; jumps straight to it when motion is reduced.
function countUp(el, to, { prefix = "", suffix = "", decimals = 0, ms = 900 } = {}) {
  if (reduce) { el.textContent = prefix + fmt(to, decimals) + suffix; return; }
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / ms);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = prefix + fmt(to * eased, decimals) + suffix;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Exchange rate: open.er-api.com (free, no key, daily update).
fetch("https://open.er-api.com/v6/latest/USD")
  .then((r) => r.json())
  .then((d) => {
    countUp(document.getElementById("fx"), d.rates.IDR, { prefix: "Rp" });
    const when = new Date(d.time_last_update_utc).toLocaleDateString("id-ID", { dateStyle: "medium" });
    document.getElementById("fx-sub").innerHTML = `1 USD · diperbarui ${when} · <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a>`;
  })
  .catch(() => { document.getElementById("fx").textContent = "–"; document.getElementById("fx-sub").textContent = "Kurs belum bisa dimuat."; });

// Weather: Open-Meteo (free, no key). Kuningan, West Java.
const WX = {
  0: ["Cerah", "clear_day"], 1: ["Cerah berawan", "partly_cloudy_day"], 2: ["Berawan sebagian", "partly_cloudy_day"], 3: ["Berawan", "cloud"],
  45: ["Berkabut", "foggy"], 48: ["Berkabut", "foggy"],
  51: ["Gerimis", "rainy"], 53: ["Gerimis", "rainy"], 55: ["Gerimis lebat", "rainy"],
  61: ["Hujan ringan", "rainy"], 63: ["Hujan", "rainy"], 65: ["Hujan lebat", "rainy"],
  80: ["Hujan lokal", "rainy"], 81: ["Hujan lokal", "rainy"], 82: ["Hujan deras", "rainy"],
  95: ["Badai petir", "thunderstorm"], 96: ["Badai petir", "thunderstorm"], 99: ["Badai petir", "thunderstorm"],
};
// The visitor's position when they have allowed it, else Kuningan. Coordinates go only
// to Open-Meteo (weather) and BigDataCloud (place name); nothing is stored.
const KUNINGAN = { lat: -6.98, lon: 108.48, name: "Kuningan" };
const wxTitle = document.querySelector(".card:nth-child(2) .head");

async function placeName(lat, lon) {
  try {
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`);
    const d = await r.json();
    return d.city || d.locality || d.principalSubdivision || "Lokasi Anda";
  } catch {
    return "Lokasi Anda";
  }
}

async function showWeather({ lat, lon, name }, fromGps) {
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`);
    const c = (await r.json()).current;
    const [label, icon] = WX[c.weather_code] || ["Cuaca", "partly_cloudy_day"];
    document.getElementById("wx-icon").textContent = icon;
    wxTitle.lastChild.textContent = `Cuaca ${name}`;
    countUp(document.getElementById("wx"), c.temperature_2m, { suffix: "°C", decimals: 1 });
    const ask = fromGps ? "" : ` · <a href="#" id="use-gps">Pakai lokasi saya</a>`;
    document.getElementById("wx-sub").innerHTML = `${label} · lembap ${c.relative_humidity_2m}% · angin ${fmt(c.wind_speed_10m, 1)} km/j${ask}`;
    document.getElementById("use-gps")?.addEventListener("click", (e) => { e.preventDefault(); askGps(); });
  } catch {
    document.getElementById("wx").textContent = "–";
    document.getElementById("wx-sub").textContent = "Cuaca belum bisa dimuat.";
  }
}

function askGps() {
  if (!navigator.geolocation) return;
  document.getElementById("wx-sub").textContent = "Mencari lokasi…";
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude: lat, longitude: lon } = pos.coords;
      showWeather({ lat, lon, name: await placeName(lat, lon) }, true);
    },
    () => showWeather(KUNINGAN, false),
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 },
  );
}

// Use GPS straight away only when the visitor already granted it; otherwise offer it.
(navigator.permissions?.query({ name: "geolocation" }) ?? Promise.reject())
  .then((p) => (p.state === "granted" ? askGps() : showWeather(KUNINGAN, false)))
  .catch(() => showWeather(KUNINGAN, false));

// Clock in Western Indonesia Time.
function tick() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("id-ID", { timeZone: "Asia/Jakarta", hour12: false });
  document.getElementById("date").textContent = now.toLocaleDateString("id-ID", { timeZone: "Asia/Jakarta", weekday: "long", day: "numeric", month: "long", year: "numeric" }) + " · WIB";
}
tick();
setInterval(tick, 1000);

// Plugin users this week, from the GeoLibre plugin registry.
const MINE = ["layout-composer", "geolibre-inaturalist-extractor", "geolibre-gbif-data"];
fetch("https://plugins.geolibre.app/plugins/stats.json", { cache: "no-cache" })
  .then((r) => r.json())
  .then((d) => {
    const rows = MINE.map((id) => d.plugins?.[id] || { usersThisWeek: 0, launches: 0 });
    const users = rows.reduce((s, r) => s + (r.usersThisWeek || 0), 0);
    const launches = rows.reduce((s, r) => s + (r.launches || 0), 0);
    countUp(document.getElementById("users"), users);
    document.getElementById("users-sub").innerHTML = `minggu ini · ${fmt(launches)} total launch · <a href="https://plugins.geolibre.app" target="_blank" rel="noopener">registri GeoLibre</a>`;
  })
  .catch(() => { document.getElementById("users").textContent = "–"; document.getElementById("users-sub").textContent = "Data belum bisa dimuat."; });
</script>
</body>
</html>
